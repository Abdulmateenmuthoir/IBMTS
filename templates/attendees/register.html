<!DOCTYPE html>
<html>
<head>
    <title>Register - IBMTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#F4F5F7] flex items-center justify-center min-h-screen p-6">

    <div class="bg-white p-8 rounded-xl shadow w-full max-w-lg">

        <h1 class="text-2xl font-bold text-[#04634D] mb-2">
            Register for IBMTS
        </h1>

        <p class="text-gray-500 mb-6">
            Join 500+ participants for a day of learning, networking, and innovation.
        </p>

        <form method="POST">
            {% csrf_token %}

            <input name="name" placeholder="Full Name"
                class="w-full mb-4 p-3 border rounded-lg" required>

            <input name="email" type="email" placeholder="Email Address"
                class="w-full mb-4 p-3 border rounded-lg" required>

            <input name="phone" placeholder="Phone Number"
                class="w-full mb-4 p-3 border rounded-lg" required>

            <select name="category" class="w-full mb-4 p-3 border rounded-lg" required>
                <option value="">Select Category</option>
                <option value="student">Student</option>
                <option value="professional">Professional</option>
                <option value="entrepreneur">Entrepreneur</option>
            </select>

            <button class="w-full bg-[#04634D] hover:bg-[#069C79] text-white py-3 rounded-lg font-semibold">
                Register Now
            </button>
        </form>

        <!-- 📞 Contact -->
        <div class="mt-4 text-center">
            <a href="https://wa.me/2349059284682" 
               class="text-[#04634D] font-medium hover:underline">
                Need help? Contact us
            </a>
        </div>

    </div>

</body>
</html>
