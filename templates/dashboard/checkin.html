<!DOCTYPE html>
<html>
<head>
    <title>Check-in Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F4F5F7] p-6">

    <!-- 🔷 Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-[#04634D]">IBMTS Check-in</h1>
            <p class="text-gray-500">Manage attendees efficiently</p>
        </div>

        <div class="flex gap-3">
            <a href="/register/" 
               class="bg-[#069C79] hover:bg-[#04634D] text-white px-4 py-2 rounded-lg shadow">
                + Quick Register
            </a>
            <a href="{% url 'admin_logout' %}" 
               class="bg-red-500 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow font-semibold">
                Log Out
            </a>
        </div>
    </div>

    <!-- 📊 Stats -->
    <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-white p-4 rounded-xl shadow">
            <p class="text-gray-500">Total Attendees</p>
            <h2 class="text-2xl font-bold" id="totalCount">0</h2>
        </div>

        <div class="bg-white p-4 rounded-xl shadow">
            <p class="text-gray-500">Checked-in</p>
            <h2 class="text-2xl font-bold text-green-600" id="checkedCount">0</h2>
        </div>

        <div class="bg-white p-4 rounded-xl shadow">
            <p class="text-gray-500">Pending</p>
            <h2 class="text-2xl font-bold text-red-500" id="pendingCount">0</h2>
        </div>
    </div>

    <!-- 🔍 Search -->
    <div class="mb-4">
        <input 
            type="text" 
            name="q" 
            placeholder="Search by name, email or phone..."
            class="w-full md:w-96 border p-3 rounded-lg shadow-sm focus:ring-2 focus:ring-[#069C79]"
        >
    </div>

    <!-- 👥 Table -->
    <div class="bg-white rounded-xl shadow overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-[#04634D] text-white">
                <tr>
                    <th class="p-4">Name</th>
                    <th class="p-4">Email</th>
                    <th class="p-4">Phone</th>
                    <th class="p-4">Status</th>
                    <th class="p-4">Action</th>
                </tr>
            </thead>

            <tbody id="attendeeTable"></tbody>
        </table>
    </div>

    <!-- ⚡ Script -->
    <script>
    const input = document.querySelector('input[name="q"]');
    const table = document.getElementById('attendeeTable');

    const totalCount = document.getElementById('totalCount');
    const checkedCount = document.getElementById('checkedCount');
    const pendingCount = document.getElementById('pendingCount');

    function loadAttendees(query = '') {
        fetch(`/api/search/?q=${query}&_=${Date.now()}`)
            .then(res => res.json())
            .then(data => {
                table.innerHTML = '';

                data.attendees.forEach(a => {
                    table.innerHTML += `
                        <tr class="border-t hover:bg-gray-50 transition">
                            <td class="p-4 font-medium">${a.name}</td>
                            <td class="p-4">${a.email}</td>
                            <td class="p-4">${a.phone}</td>

                            <td class="p-4">
                                ${a.checked_in 
                                    ? '<span class="text-green-600 font-semibold">✔ Checked-in</span>' 
                                    : '<span class="text-red-500">Pending</span>'}
                            </td>

                            <td class="p-4">
                                ${!a.checked_in 
                                    ? `<button onclick="checkIn(${a.id})" 
                                        class="bg-[#069C79] hover:bg-[#04634D] text-white px-3 py-1 rounded-lg transition shadow-sm font-semibold">
                                        Check-in
                                       </button>`
                                    : '<span class="text-gray-400 font-semibold">Done</span>'}
                            </td>
                        </tr>
                    `;
                });

                if (data.attendees.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="5" class="p-6 text-center text-gray-500">
                                No attendees found
                            </td>
                        </tr>
                    `;
                }
            });
    }

    function syncStats() {
        fetch(`/api/checkin-sync/?_=${Date.now()}`)
            .then(res => res.json())
            .then(data => {
                totalCount.innerText = data.total_registered;
                checkedCount.innerText = data.total_checked_in;
                pendingCount.innerText = data.total_registered - data.total_checked_in;
            })
            .catch(() => {});
    }

    // 🔍 Live search
    input.addEventListener('keyup', () => {
        loadAttendees(input.value);
    });

    // ⚡ Check-in
    function checkIn(id) {
        fetch(`/checkin/${id}/`, { method: 'GET' }) // Works fine with Django mapping to get query or simple function call
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    loadAttendees(input.value);
                    syncStats();
                }
            });
    }

    // Background polling every 5 seconds to sync stats and current search view
    setInterval(() => {
        syncStats();
        // Since we also want any background check-ins by others to reflect if we are viewing them:
        loadAttendees(input.value);
    }, 5000);

    // 🚀 Load on page start
    document.addEventListener("DOMContentLoaded", () => {
        loadAttendees();
        syncStats();
    });
    </script>

</body>
</html>
